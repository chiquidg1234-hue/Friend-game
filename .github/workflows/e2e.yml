name: Probar en emulador

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Dos APK: uno "viejo" (versión 1) para probar que la app se actualiza sola, y el
      # normal con un número alto para que no ofrezca actualizaciones en el resto de la prueba.
      - name: Compilar APK de prueba
        run: |
          FG_VERSION_CODE=1 ./gradlew --no-daemon assembleGithubDebug
          cp app/build/outputs/apk/github/debug/app-github-debug.apk app-debug-v1.apk
          FG_VERSION_CODE=999999 ./gradlew --no-daemon assembleGithubDebug

      # Para simular con firmas reales al admin de un grupo de otra persona.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas de la prueba
        run: python -m pip install --quiet cryptography

      # El servidor de GitHub no tiene tarjeta de sonido: un audio virtual le da micrófono
      # al emulador para poder probar la grabación.
      - name: Audio virtual para el emulador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio > /dev/null
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual
          pactl set-default-sink virtual
          pactl set-default-source virtual.monitor
          pactl info | grep -iE "default|server string"
          # El emulador busca el audio en esta dirección.
          echo "PULSE_SERVER=$(pactl info | sed -n 's/^Server String: //p')" >> "$GITHUB_ENV"

      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar la app en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: bash tools/e2e/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-capturas
          path: e2e-out

      # Las capturas también quedan en una pre-release para verlas sin iniciar sesión.
      - name: Publicar capturas
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: capturas
          name: Capturas de la prueba en emulador
          prerelease: true
          make_latest: false
          files: e2e-out/*.png
          body: |
            Capturas automáticas de la última prueba en un emulador Android 15 (commit ${{ github.sha }}).
            Para instalar la app usa la versión más reciente, no esta.
