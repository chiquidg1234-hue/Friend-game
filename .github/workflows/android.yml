name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Compilar la app
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk FriendGame.apk
          ls -l FriendGame.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FriendGame-apk
          path: FriendGame.apk

      - name: Publicar descarga
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Friend Game 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: FriendGame.apk
          body: |
            📲 **Descarga `FriendGame.apk` abajo (en "Assets") desde tu celular Android y ábrelo para instalar.**

            Si Android pregunta, permite "instalar apps de esta fuente". Si ya tenías una versión anterior, esta se instala encima y conservas tus amigos y audios.
