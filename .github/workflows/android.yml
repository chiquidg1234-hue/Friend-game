name: Compilar APK

on:
  push:
    paths-ignore:
      - "tools/e2e/**"
      - ".github/workflows/e2e.yml"
      - "README.md"
      - "docs/**"
      - "!docs/legal/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # La clave de subida para Google Play va en secretos (ver docs/PLAY_STORE.md). Sin ella,
      # el paquete para Play sale sin firmar.
      - name: Clave de subida para Google Play
        env:
          KEYSTORE_B64: ${{ secrets.FG_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "FG_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "Sin clave de subida: el .aab para Play saldrá sin firmar."
          fi

      # Variables en Settings → Secrets and variables → Actions → Variables:
      # FG_DONATE_URL (por ejemplo https://paypal.me/TU_USUARIO/{amount}USD) y FG_CONTACT_EMAIL.
      - name: Compilar la app
        env:
          FG_DONATE_URL: ${{ vars.FG_DONATE_URL }}
          FG_CONTACT_EMAIL: ${{ vars.FG_CONTACT_EMAIL }}
          FG_UPLOAD_STORE_PASSWORD: ${{ secrets.FG_UPLOAD_STORE_PASSWORD }}
          FG_UPLOAD_KEY_ALIAS: ${{ secrets.FG_UPLOAD_KEY_ALIAS }}
          FG_UPLOAD_KEY_PASSWORD: ${{ secrets.FG_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleGithubRelease bundlePlayRelease

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk FriendGame.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab FriendGame-play.aab
          ls -l FriendGame.apk FriendGame-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: FriendGame-apk
          path: FriendGame.apk

      # Paquete para subir a Google Play Console (Producción, Prueba cerrada…).
      - uses: actions/upload-artifact@v4
        with:
          name: FriendGame-play-aab
          path: FriendGame-play.aab

      - name: Publicar descarga
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Friend Game 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: FriendGame.apk
          body: |
            ## 📲 Cómo instalar Friend Game

            **1. Abre esta página en Chrome.** Si llegaste desde WhatsApp, un código QR u otra app y arriba ves una **✕**, estás en una ventanita dentro de esa app: toca **⋮** (arriba a la derecha) → **Abrir en Chrome**. En esa ventanita el archivo se descarga, pero el instalador nunca aparece.

            **2. Ya en Chrome, toca aquí:**

            ### [⬇️ Descargar FriendGame.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/FriendGame.apk)

            **3.** Cuando termine, toca **Abrir** (o busca `FriendGame.apk` en **Archivos → Descargas**) y luego **Instalar**. La primera vez Android pide permiso: toca **Configuración**, activa **Permitir de esta fuente** y vuelve atrás.

            ---

            - **¿Un amigo ya la tiene?** Que te la pase desde la app con **Amigos → Pasar la app** (Quick Share o Bluetooth): se instala sin navegador.
            - **¿Ya la tienes?** No hace falta volver aquí: la app avisa cuando hay una versión nueva y se actualiza desde dentro.
            - Funciona en Android 8 o más nuevo.
